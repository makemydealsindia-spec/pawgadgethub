  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
