      <text x="14" y="24">01. Grand Slam Offers</text>

      <rect x="190" y="0" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="204" y="24">02. Brand Positioning</text>

      <rect x="0" y="48" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="14" y="72">03. Conversion Copy</text>

      <rect x="190" y="48" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="204" y="72">04. 8-Phase Funnels</text>

      <rect x="0" y="96" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="14" y="120">05. DTC Landing Pages</text>

      <rect x="190" y="96" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="204" y="120">06. Refactoring UI/UX</text>

      <rect x="0" y="144" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="14" y="168">07. Identity &amp; Brand</text>

      <rect x="190" y="144" width="176" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="204" y="168">08. E-Com SEO &amp; AI</text>
