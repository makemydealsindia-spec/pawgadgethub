    <rect x="20" y="284" width="366" height="26" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="203" y="301" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#A7F3D0">+ Organic • Paid Ads • UGC Video • Email CRM • CRO + Code</text>
