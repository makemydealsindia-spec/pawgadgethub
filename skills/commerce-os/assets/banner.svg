  <text x="98" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.8">CLAUDE CODE  •  CODEX  •  ANTIGRAVITY</text>

  <!-- Main Title & Tagline -->
  <text x="64" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">Commerce OS</text>
  <rect x="64" y="166" width="220" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="64" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">The 13-in-1 Full-Stack D2C &amp; E-Commerce Growth Mentor Skill</text>
  <text x="64" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Diagnose bottlenecks, craft Grand Slam offers, write conversion copy, and ship production</text>
  <text x="64" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">storefront code powered by 13 battle-tested operator frameworks.</text>

